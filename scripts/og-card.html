<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    position: relative;
    overflow: hidden;
    background: #0d0d11;
    color: #ececf1;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
  }
  .knurl {
    position: absolute;
    inset: 0;
    background-image:
      repeating-linear-gradient(45deg, rgba(109, 143, 255, 0.16) 0 1.5px, transparent 1.5px 16px),
      repeating-linear-gradient(-45deg, rgba(109, 143, 255, 0.16) 0 1.5px, transparent 1.5px 16px);
    -webkit-mask-image: radial-gradient(ellipse 60% 85% at 78% 50%, #000 15%, transparent 78%);
  }
  .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 600px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 18px; margin-bottom: 40px; }
  .brand img { width: 72px; height: 72px; border-radius: 16px; }
  .brand span { font-size: 44px; font-weight: 800; letter-spacing: -0.02em; }
  h1 { font-size: 62px; text-wrap: balance; line-height: 1.02; font-weight: 800; letter-spacing: -0.035em; margin-bottom: 28px; }
  p { max-width: 520px; text-wrap: balance; font-size: 27px; line-height: 1.35; color: #9d9dac; }
  .ring { position: absolute; left: 870px; top: 315px; }
  .bubble, .hub { position: absolute; border-radius: 50%; background: #17171d; border: 1.5px solid rgba(255, 255, 255, 0.16); box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55); display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .bubble { width: 104px; height: 104px; margin: -52px 0 0 -52px; gap: 4px; }
  .bubble.sel { border: 4px solid #6d8fff; transform: scale(1.1); }
  .glyph { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 24px; box-shadow: inset 0 -3px 6px rgba(0, 0, 0, 0.25); }
  .label { font-size: 15px; font-weight: 600; }
  .num { position: absolute; top: 2px; right: 2px; width: 26px; height: 26px; border-radius: 50%; background: #8e8e98; color: #fff; font-size: 15px; font-weight: 700; display: grid; place-items: center; }
  .sel .num { background: #6d8fff; }
  .hub { width: 230px; height: 230px; margin: -115px 0 0 -115px; gap: 8px; text-align: center; }
  .hub b { font-size: 24px; }
  .hub small { font-size: 17px; color: #9d9dac; }
  .hub em { font-style: normal; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .hub em i { width: 18px; height: 18px; border-radius: 4px; background: #6d8fff; display: inline-grid; place-items: center; color: #fff; font-style: normal; font-size: 13px; font-weight: 900; }
  .url { position: absolute; left: 72px; bottom: 44px; font: 600 20px ui-monospace, "SF Mono", Menlo, monospace; color: #93acff; letter-spacing: 0.02em; }
</style>
</head>
<body>
  <div class="knurl"></div>
  <div class="copy">
    <div class="brand"><img src="../docs/assets/icon.png" alt=""><span>knURLink</span></div>
    <h1>every link, in the browser it belongs in.</h1>
    <p>a macOS menu bar app that routes links by rule, or pops a ring of browsers at your cursor.</p>
  </div>
  <div class="ring" id="ring"></div>
  <div class="url">ry4nolson.github.io/knurlink</div>
  <script>
    const items = [
      ["C", "#2ea44f", "work"],
      ["C", "#2ea44f", "personal"],
      ["B", "#ef5a2c", "Brave"],
      ["S", "#1593e6", "personal"],
      ["S", "#1593e6", "work"],
      ["F", "#8e44ec", "Firefox"],
    ];
    const ring = document.getElementById("ring");
    const r = 205;
    items.forEach(([letter, color, label], i) => {
      const a = -Math.PI / 2 + (2 * Math.PI * i) / items.length;
      const b = document.createElement("div");
      b.className = "bubble" + (i === 2 ? " sel" : "");
      b.style.left = `${Math.cos(a) * r}px`;
      b.style.top = `${Math.sin(a) * r}px`;
      b.innerHTML = `<span class="glyph" style="background:radial-gradient(circle at 32% 28%, color-mix(in srgb, ${color} 55%, #fff), ${color} 62%, color-mix(in srgb, ${color} 70%, #000))">${letter}</span><span class="label">${label}</span><span class="num">${i + 1}</span>`;
      ring.append(b);
    });
    const hub = document.createElement("div");
    hub.className = "hub";
    hub.innerHTML = "<b>tiktok.com</b><small>Brave</small><em><i>✓</i>Always for tiktok.com</em>";
    ring.append(hub);
  </script>
</body>
</html>
