name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      APPLE_TEAM_ID: M3C8F32WA5
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" Resources/Info.plist
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Run tests
        run: swift test

      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE_P12" ]; then
            echo "::error::DEVELOPER_ID_P12 is not set. Refusing to publish an unsigned release."
            exit 1
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          echo "KNURLINK_SIGN_IDENTITY=Developer ID Application: Texas Beard Company LLC ($APPLE_TEAM_ID)" >> "$GITHUB_ENV"

      - name: Build app bundle
        run: |
          ./scripts/build-app.sh
          test -f dist/knURLink.app/Contents/Resources/SponsorLogo.png
          codesign --verify --strict --verbose=2 dist/knURLink.app

      - name: Notarize app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        run: |
          cd dist
          ditto -c -k --keepParent knURLink.app knURLink.zip
          xcrun notarytool submit knURLink.zip --apple-id "$APPLE_ID" --password "$APPLE_ID_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple knURLink.app
          rm knURLink.zip
          ditto -c -k --keepParent knURLink.app knURLink.zip

      - name: Create and notarize disk image
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        run: |
          ./scripts/create-dmg.sh
          codesign --force --timestamp --sign "$KNURLINK_SIGN_IDENTITY" dist/knURLink.dmg
          xcrun notarytool submit dist/knURLink.dmg --apple-id "$APPLE_ID" --password "$APPLE_ID_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple dist/knURLink.dmg
          spctl --assess --type open --context context:primary-signature --verbose=2 dist/knURLink.dmg

      - name: Extract release notes
        run: |
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release v$VERSION"
          fi
          echo "$NOTES" > "$RUNNER_TEMP/release_notes.md"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/knURLink.dmg dist/knURLink.zip \
            --title "knURLink $VERSION" \
            --notes-file "$RUNNER_TEMP/release_notes.md"
